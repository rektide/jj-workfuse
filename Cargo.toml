[package]
name = "jj-workfuse"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Read-only lazy FUSE subtree projections of Jujutsu revisions"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-31"] }
futures = "0.3"
jj-lib = "=0.46.0"
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
gix = { version = "=0.88.0", default-features = false }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
